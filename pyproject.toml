[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lector-facturas"
version = "0.2.0"
description = "Avance reproducible: SROIE + WildReceipt, Tesseract y Document AI"
requires-python = ">=3.10"
dependencies = ["Pillow>=10,<13", "numpy>=1.24,<3", "pandas>=2,<4", "matplotlib>=3.7,<4", "pypdfium2>=4.25,<6"]

[project.optional-dependencies]
cloud = ["google-cloud-documentai>=3,<4"]
notebook = ["jupyterlab>=4,<5", "nbformat>=5,<6"]

[project.scripts]
lector = "lector_facturas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
